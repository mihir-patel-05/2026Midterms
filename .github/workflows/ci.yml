name: Continuous Integration

on:
  pull_request:
    branches: [main, develop]
  push:
    branches: [main, develop]

jobs:
  backend-ci:
    name: Backend – type-check & build
    runs-on: ubuntu-latest
    permissions:
      contents: read
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ vars.NODE_VERSION || '20' }}
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma clients
        # Both the main client and the polls database's (prisma/polls).
        run: npm run prisma:generate

      - name: Validate Prisma schemas
        run: npx prisma validate && npx prisma validate --schema prisma/polls/schema.prisma
        env:
          DATABASE_URL: postgresql://ci:ci@localhost:5432/ci
          POLLS_DATABASE_URL: postgresql://ci:ci@localhost:5432/ci_polls

      - name: Type-check
        run: npm run typecheck

      - name: Unit tests
        run: npm test
        env:
          # env.ts requires DATABASE_URL at import; unit tests never connect.
          # Database tests stay skipped because TEST_DATABASE_URL is unset.
          DATABASE_URL: postgresql://ci:ci@localhost:5432/ci

      - name: Build
        run: npm run build

  frontend-ci:
    name: Frontend – lint & build
    runs-on: ubuntu-latest
    permissions:
      contents: read
    defaults:
      run:
        working-directory: CODE
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ vars.NODE_VERSION || '20' }}
          cache: 'npm'
          cache-dependency-path: CODE/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Dockerfile build args
        # Every VITE_* name read in src needs an ARG in CODE/Dockerfile.
        run: npm run check:build-args

      - name: Lint
        run: npm run lint -- --max-warnings 0

      - name: Type-check
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

  admin-ci:
    name: Admin Dashboard – build
    runs-on: ubuntu-latest
    permissions:
      contents: read
    defaults:
      run:
        working-directory: admin-dashboard
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ vars.NODE_VERSION || '20' }}
          cache: 'npm'
          cache-dependency-path: admin-dashboard/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Type-check
        run: npm run typecheck

      - name: Build
        run: npm run build
