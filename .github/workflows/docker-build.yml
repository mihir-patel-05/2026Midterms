name: Docker Build & Smoke Test

on:
  push:
    branches: [main]
    paths:
      - 'backend/**'
      - 'docker-compose.yml'
    tags:
      - 'v*.*.*'
  pull_request:
    # Build and smoke-test only; the login and push steps skip pull requests.
    paths:
      - 'backend/**'
      - 'docker-compose.yml'
      - '.github/workflows/docker-build.yml'

env:
  REGISTRY: ghcr.io

jobs:
  build:
    name: Build Docker image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      - name: Set image name
        # Registry names must be lowercase, and the repository is
        # mihir-patel-05/2026Midterms, so lowercase github.repository.
        run: echo "IMAGE=${REGISTRY}/${GITHUB_REPOSITORY,,}/backend" >> "$GITHUB_ENV"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata (tags, labels)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,prefix=sha-,format=short

      - name: Build Docker image (load locally for smoke test)
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          tags: ${{ env.IMAGE }}:${{ github.sha }}
          labels: ${{ steps.meta.outputs.labels }}
          load: true
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Smoke test – health endpoint
        run: |
          docker run -d --name backend-smoke \
            -e DATABASE_URL="postgresql://dummy:dummy@localhost:5432/dummy" \
            -e FEC_API_KEY="dummy" \
            -e GEMINI_API_KEY="dummy" \
            -e NODE_ENV="test" \
            -p 3001:3001 \
            "$IMAGE:${{ github.sha }}"

          # The container runs `prisma generate` before the server starts, so
          # poll for up to 60 seconds instead of sleeping a fixed time.
          echo "Waiting for container to start..."
          HTTP_CODE=000
          for _ in $(seq 1 30); do
            HTTP_CODE=$(curl -s -o /dev/null -w "%{http_code}" http://localhost:3001/api/health/live || true)
            [ "$HTTP_CODE" = "200" ] && break
            sleep 2
          done
          echo "Health check HTTP status: $HTTP_CODE"

          if [ "$HTTP_CODE" != "200" ]; then
            docker logs backend-smoke || true
          fi
          docker stop backend-smoke || true
          docker rm backend-smoke || true

          if [ "$HTTP_CODE" != "200" ]; then
            echo "❌ Smoke test failed – unexpected HTTP status $HTTP_CODE"
            exit 1
          fi
          echo "✅ Liveness smoke test passed (HTTP $HTTP_CODE)"

      - name: Push Docker image
        if: github.event_name != 'pull_request'
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          push: true
          cache-from: type=gha
          cache-to: type=gha,mode=max
