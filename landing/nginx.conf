server {
    # ${PORT}, ${WAR_ROOM_URL} and ${SITE_URL} are filled in when the container starts (nginx image template
    # support). The Dockerfile gives each a default; set them on Railway to change them without a rebuild.
    listen ${PORT};
    root /usr/share/nginx/html;
    index index.html;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    # A static page with no inline code, so a strict policy fits. Fonts come from Google Fonts.
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; img-src 'self' data:; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'none'" always;
    server_tokens off;

    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_min_length 512;
    gzip_types text/plain text/css application/javascript image/svg+xml;

    # Point every Launch button at the dashboard. Only HTML responses are rewritten.
    sub_filter '__WAR_ROOM_URL__' '${WAR_ROOM_URL}';
    sub_filter '__SITE_URL__' '${SITE_URL}';
    sub_filter_once off;

    # Short cache on everything: file names carry no hash, and the page should pick up edits quickly.
    location / {
        expires 5m;
        try_files $uri $uri/ /index.html;
    }

    # Cheap health check for Railway.
    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok";
    }
}
