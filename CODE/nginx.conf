server {
    # PORT is substituted at container start (nginx image template support).
    # Defaults to 80 in the Dockerfile; Railway overrides it.
    listen ${PORT};
    root /usr/share/nginx/html;
    index index.html;

    # Security headers. `always` adds them to error responses too. The page loads map
    # tiles and calls the API cross-origin, so no full CSP here: only block framing.
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Content-Security-Policy "frame-ancestors 'none'" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    server_tokens off;

    # Compress text responses. The map script is about 1.1 MB raw and 300 KB gzipped, and the
    # district and county TopoJSON files shrink the same way, which matters most on phones.
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_types text/plain text/css text/xml application/javascript application/json application/xml
        application/manifest+json image/svg+xml;

    # Vite puts a content hash in every file name under /assets, so browsers can keep them for a year.
    # `expires` sets Cache-Control without add_header, so the security headers above still apply here.
    location /assets/ {
        expires 1y;
        try_files $uri =404;
    }

    # The page itself must be re-checked on every visit, so a deploy reaches open tabs on their next load.
    location = /index.html {
        expires -1;
    }

    # SPA fallback - serve index.html for all routes.
    # API calls go directly to VITE_API_URL, so there is no /api proxy here.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
