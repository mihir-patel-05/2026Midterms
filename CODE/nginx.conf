server {
    # PORT is substituted at container start (nginx image template support).
    # Defaults to 80 in the Dockerfile; Railway overrides it.
    listen ${PORT};
    root /usr/share/nginx/html;
    index index.html;

    # Security headers. `always` adds them to error responses too. The page loads map
    # tiles and calls the API cross-origin, so no full CSP here: only block framing.
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Content-Security-Policy "frame-ancestors 'none'" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    server_tokens off;

    # SPA fallback - serve index.html for all routes.
    # API calls go directly to VITE_API_URL, so there is no /api proxy here.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
